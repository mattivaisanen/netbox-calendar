{% load i18n %}
{% with entry=running.0 %}
  <a href="{{ entry.url }}" class="btn btn-danger btn-sm me-2"
     title="{% blocktrans with title=entry.title end=entry.end|date:'SHORT_DATETIME_FORMAT' %}{{ title }}, until {{ end }}{% endblocktrans %}">
    <i class="mdi mdi-snowflake"></i> {% trans "Change freeze" %}
  </a>
{% endwith %}
